<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
  <title>Voyage · An Italian Road Trip</title>
  <meta name="description" content="Voyage, an isometric arcade road trip across Italy. Vincenzo Salvia Studio.">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <style>
    html, body { margin: 0; height: 100%; background: #070b08; overflow: hidden; }
    #game { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; background: #070b08; outline: none; }
    #loading { position: fixed; inset: 0; background: #070b08; z-index: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
               font-family: "Courier New", monospace; color: #ffd933; letter-spacing: 6px; image-rendering: pixelated; }
    #loading img { width: 96px; height: 96px; image-rendering: auto; }
    #title { font-size: 34px; font-weight: bold; }
    #bar { width: 260px; height: 10px; border: 2px solid #ffd933; padding: 2px; }
    #fill { width: 0; height: 100%; background: #ffd933; }
    #note { font-size: 12px; letter-spacing: 2px; color: #9aa39c; }
    #coin { display: none; font-size: 22px; font-weight: bold; letter-spacing: 5px; color: #ffd933; animation: blink 1s steps(1) infinite; }
    #coin small { display: block; margin-top: 10px; font-size: 12px; letter-spacing: 3px; color: #f2efe6; text-align: center; }
    @keyframes blink { 50% { opacity: 0; } }
    #error { display: none; position: fixed; left: 50%; top: 20px; transform: translateX(-50%); background: #d8352a; color: #fff;
             font-family: "Courier New", monospace; padding: 10px 16px; letter-spacing: 1px; z-index: 2; }
  </style>
</head>
<body>
  <canvas id="game" tabindex="-1"></canvas>
  <div id="loading">
    <img src="favicon.png" alt="">
    <div id="title">VOYAGE</div>
    <div id="bar"><div id="fill"></div></div>
    <div id="note">BEST WITH A KEYBOARD OR A GAMEPAD</div>
    <div id="coin">INSERT COIN<small>PRESS ANY KEY OR CLICK</small></div>
  </div>
  <div id="error"></div>
  <script>
    var canvas = document.getElementById("game");
    var buildUrl = "Build";
    var config = {
      dataUrl: buildUrl + "/78720a57329c7f5b0d7a950ab375381e.data.unityweb",
      frameworkUrl: buildUrl + "/d25ba467e7a56ff6ad92506c6c01d2e2.framework.js.unityweb",
      codeUrl: buildUrl + "/e359ebfc064bc1bc8f144189ba6911c9.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "VS Studio",
      productName: "Voyage",
      productVersion: "0.1.0",
      showBanner: function (msg, type) {
        if (type !== "error") return;
        var e = document.getElementById("error");
        e.textContent = msg; e.style.display = "block";
      }
    };
    var script = document.createElement("script");
    script.src = buildUrl + "/552c3ffb739c4d6aae59749978050dd0.loader.js";
    script.onload = function () {
      createUnityInstance(canvas, config, function (p) {
        document.getElementById("fill").style.width = (100 * p) + "%";
      }).then(function (unity) {
        // il browser fa partire l'audio solo dopo un gesto: lo chiediamo noi, da sala giochi
        document.getElementById("bar").style.display = "none";
        document.getElementById("note").style.display = "none";
        document.getElementById("coin").style.display = "block";
        var start = function (e) {
          // il tasto della moneta non arriva al gioco (non deve scegliere PLAY da solo); l'audio lo sblocchiamo qui
          if (e) { e.preventDefault(); e.stopPropagation(); }
          try { if (window.WEBAudio && WEBAudio.audioContext && WEBAudio.audioContext.state !== "running") WEBAudio.audioContext.resume(); } catch (x) {}
          // la monetina: due note da sala giochi, suonate dalla pagina; sblocca l'audio e poi parte il brano del menu
          try {
            var ac = new (window.AudioContext || window.webkitAudioContext)(), t0 = ac.currentTime + 0.02;
            [[988, 0, 0.07], [1319, 0.07, 0.35]].forEach(function (n) {
              var o = ac.createOscillator(), g = ac.createGain();
              o.type = "square"; o.frequency.value = n[0];
              g.gain.setValueAtTime(0.0001, t0 + n[1]);
              g.gain.exponentialRampToValueAtTime(0.12, t0 + n[1] + 0.01);
              g.gain.exponentialRampToValueAtTime(0.0001, t0 + n[1] + n[2]);
              o.connect(g); g.connect(ac.destination); o.start(t0 + n[1]); o.stop(t0 + n[1] + n[2] + 0.02);
            });
          } catch (x) {}
          try { unity.SendMessage("Voyage", "OnCredit"); } catch (x) {} // il gettone vale tre crediti
          setTimeout(function () { try { unity.SendMessage("Voyage", "OnCoin"); } catch (x) {} }, 450); // il brano del menu, da capo
          document.getElementById("loading").style.display = "none";
          window.removeEventListener("keydown", start, true);
          window.removeEventListener("pointerdown", start, true);
          canvas.focus();
        };
        window.addEventListener("keydown", start, true);
        window.addEventListener("pointerdown", start, true);
      }).catch(function (m) { config.showBanner(String(m), "error"); });
    };
    document.body.appendChild(script);
    // un clic sul gioco gli restituisce la tastiera
    canvas.addEventListener("pointerdown", function () { canvas.focus(); });
  </script>
</body>
</html>
